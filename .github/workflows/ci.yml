name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  # Minimum Claude Code version the mod targets; mod/types-vendor is generated by it.
  CLAUDE_CODE_VERSION: 2.1.295

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test graph logic
        run: pnpm test

      - name: Test and build the viewer
        run: pnpm viewer:test && pnpm viewer:build

      - name: Test and build the landing page
        run: pnpm site:test && pnpm site:build

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}

      - name: Validate and test the mod
        run: pnpm validate

  overlay:
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build the overlay
        run: swift build --package-path apps/overlay

      - name: Run the overlay checks (XCTest)
        run: swift test --package-path apps/overlay

      - name: Run the overlay checks (plain runner)
        run: swift run --package-path apps/overlay overlay-checks

  overlay-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.18.0 --activate

      - name: Build the viewer the app bundles
        run: pnpm install --frozen-lockfile && FLOWCTL_NO_FIXTURES=1 pnpm viewer:build

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/overlay-tauri/src-tauri

      - name: Lint, test and build the Windows overlay
        working-directory: apps/overlay-tauri/src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test
          cargo build --release

